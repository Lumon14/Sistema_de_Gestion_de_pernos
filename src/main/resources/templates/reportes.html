<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reportes de Ventas y Pagos - Pernos Vega</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/responsive/2.5.0/css/responsive.bootstrap5.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>

<div class="d-flex">
    <!-- Sidebar -->
    <div th:replace="~{sidebar :: sidebar(activeUri='/reportes/listar')}"></div>

    <!-- Main content -->
    <div id="main-content" class="main-content w-100">

        <!-- Topbar -->
        <header class="topbar">
            <div class="d-flex align-items-center gap-3">
                <button id="open-sidebar" class="btn btn-sm btn-light d-md-none p-1 px-2">
                    <i class="bi bi-list fs-5"></i>
                </button>
                <h1 class="topbar-title">Reportes de Ventas y Pagos en Línea</h1>
            </div>
            <div class="d-flex gap-2">
                <button type="button" id="btnExportarPdf" class="btn btn-danger btn-sm">
                    <i class="bi bi-file-pdf-fill"></i> Exportar PDF
                </button>
                <button type="button" id="btnExportarExcel" class="btn btn-success btn-sm">
                    <i class="bi bi-file-earmark-excel-fill"></i> Exportar Excel
                </button>
            </div>
        </header>

        <!-- Contenido -->
        <main class="p-4 fade-in-up">

            <!-- Filtros -->
            <div class="card border-0 shadow-sm mb-4">
                <div class="card-body">
                    <form id="formFiltros" class="row g-3">
                        <div class="col-md-2">
                            <label for="fechaInicio" class="form-label">Fecha Inicio</label>
                            <input type="date" id="fechaInicio" class="form-control form-control-sm">
                        </div>
                        <div class="col-md-2">
                            <label for="fechaFin" class="form-label">Fecha Fin</label>
                            <input type="date" id="fechaFin" class="form-control form-control-sm">
                        </div>
                        <div class="col-md-3">
                            <label for="metodoPago" class="form-label">Método de Pago</label>
                            <select id="metodoPago" class="form-select form-select-sm">
                                <option value="TODOS">Todos los Métodos</option>
                                <option value="EFECTIVO">Efectivo</option>
                                <option value="ONLINE">Pago en Línea / Transferencia</option>
                                <option value="TARJETA">Tarjeta de Crédito/Débito</option>
                                <option value="YAPE">Yape</option>
                                <option value="PLIN">Plin</option>
                                <option value="MIXTO">Pago Mixto</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label for="estadoFilter" class="form-label">Estado de Venta</label>
                            <select id="estadoFilter" class="form-select form-select-sm">
                                <option value="TODOS">Todos los Estados</option>
                                <option value="1">Vigentes / Activas</option>
                                <option value="0">Anuladas</option>
                            </select>
                        </div>
                        <div class="col-md-2 d-flex align-items-end">
                            <button type="button" id="btnFiltrar" class="btn btn-primary btn-sm w-100">
                                <i class="bi bi-funnel-fill"></i> Filtrar y Buscar
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Tarjetas de Resumen de Métricas -->
            <div class="row g-4 mb-4">
                <div class="col-md-4">
                    <div class="card border-0 shadow-sm bg-white p-3 d-flex flex-row align-items-center justify-content-between">
                        <div>
                            <small class="text-muted d-block fw-500">VENTAS TOTALES</small>
                            <span id="metricTotalVentas" class="fs-3 fw-bold text-dark">S/ 0.00</span>
                        </div>
                        <div class="bg-primary-subtle text-primary p-3 rounded">
                            <i class="bi bi-currency-dollar fs-4"></i>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card border-0 shadow-sm bg-white p-3 d-flex flex-row align-items-center justify-content-between">
                        <div>
                            <small class="text-muted d-block fw-500">EFECTIVO EN CAJA</small>
                            <span id="metricTotalEfectivo" class="fs-3 fw-bold text-success">S/ 0.00</span>
                        </div>
                        <div class="bg-success-subtle text-success p-3 rounded">
                            <i class="bi bi-cash-stack fs-4"></i>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card border-0 shadow-sm bg-white p-3 d-flex flex-row align-items-center justify-content-between">
                        <div>
                            <small class="text-muted d-block fw-500">PAGOS EN LÍNEA</small>
                            <span id="metricTotalOnline" class="fs-3 fw-bold text-info">S/ 0.00</span>
                        </div>
                        <div class="bg-info-subtle text-info p-3 rounded">
                            <i class="bi bi-credit-card-fill fs-4"></i>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Tabla de Resultados -->
            <div class="table-wrapper">
                <div class="p-3 border-bottom">
                    <span class="fw-600 text-secondary" style="font-size:0.82rem;">Transacciones de Venta</span>
                </div>
                <table id="tablaVentasReporte" class="table table-hover responsive" style="width:100%">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Fecha</th>
                            <th>Tipo</th>
                            <th>Serie-Número</th>
                            <th>Cliente</th>
                            <th>Vendedor</th>
                            <th>Método de Pago</th>
                            <th>Total</th>
                            <th>Estado</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>

        </main>
    </div>
</div>

<!-- Scripts -->
<script src="https://code.jquery.com/jquery-3.7.0.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
<script src="https://cdn.datatables.net/responsive/2.5.0/js/dataTables.responsive.min.js"></script>
<script src="https://cdn.datatables.net/responsive/2.5.0/js/responsive.bootstrap5.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script th:src="@{/js/main.js}"></script>

<script th:inline="none">
    $(document).ready(function() {
        // Establecer fecha de inicio por defecto (hace 30 días)
        const hoy = new Date();
        const hace30dias = new Date();
        hace30dias.setDate(hoy.getDate() - 30);

        const hoyStr = hoy.toISOString().split('T')[0];
        $('#fechaInicio').val(hace30dias.toISOString().split('T')[0]).attr('max', hoyStr);
        $('#fechaFin').val(hoyStr).attr('max', hoyStr);

        // Validación de fecha fin futura
        $('#fechaFin').on('change', function() {
            const seleccionado = $(this).val();
            if (seleccionado > hoyStr) {
                Swal.fire({
                    icon: 'warning',
                    title: 'Fecha no válida',
                    text: 'no hay ventas ese dia'
                });
                $(this).val(hoyStr);
            }
        });

        const table = $('#tablaVentasReporte').DataTable({
            responsive: true,
            order: [[0, 'desc']],
            language: {
                url: 'https://cdn.datatables.net/plug-ins/1.13.6/i18n/es-ES.json'
            },
            columns: [
                { data: 'id' },
                { 
                    data: 'fecha',
                    render: function(data) {
                        if (!data) return '';
                        const date = new Date(data);
                        return date.toLocaleString('es-PE', { hour12: false });
                    }
                },
                { data: 'tipoComprobante' },
                { 
                    data: null,
                    render: function(row) {
                        return row.serie + '-' + row.numeroComprobante;
                    }
                },
                { 
                    data: 'cliente',
                    render: function(data) {
                        return data ? data.nombre : 'Cliente General';
                    }
                },
                { 
                    data: 'usuario',
                    render: function(data) {
                        return data ? data.nombre : 'Sistema';
                    }
                },
                { 
                    data: 'metodoPago',
                    render: function(data, type, row) {
                        if (data === 'MIXTO') {
                            const parts = [];
                            if (row.montoEfectivo > 0) parts.push(`EF: S/${row.montoEfectivo.toFixed(1)}`);
                            if (row.montoYape > 0) parts.push(`YP: S/${row.montoYape.toFixed(1)}`);
                            if (row.montoTransferencia > 0) parts.push(`TR: S/${row.montoTransferencia.toFixed(1)}`);
                            if (row.montoTarjeta > 0) parts.push(`TJ: S/${row.montoTarjeta.toFixed(1)}`);
                            return `MIXTO (${parts.join(' + ')})`;
                        }
                        return data || 'EFECTIVO';
                    }
                },
                { 
                    data: 'total',
                    render: function(data) {
                        return 'S/ ' + parseFloat(data).toFixed(2);
                    }
                },
                { 
                    data: 'estado',
                    render: function(data) {
                        return data === 1 ? '<span class="badge bg-success">ACTIVA</span>' : '<span class="badge bg-danger">ANULADA</span>';
                    }
                }
            ]
        });

        function cargarDatos() {
            const fechaInicio = $('#fechaInicio').val();
            const fechaFin = $('#fechaFin').val();
            const metodoPago = $('#metodoPago').val();
            const estado = $('#estadoFilter').val();

            const hoyStr = new Date().toISOString().split('T')[0];
            if (fechaFin > hoyStr) {
                Swal.fire({
                    icon: 'warning',
                    title: 'Fecha no válida',
                    text: 'no hay ventas ese dia'
                });
                $('#fechaFin').val(hoyStr);
                return;
            }

            $.ajax({
                url: '/reportes/api/ventas',
                type: 'GET',
                data: {
                    fechaInicio: fechaInicio,
                    fechaFin: fechaFin,
                    metodoPago: metodoPago,
                    estado: estado
                },
                success: function(response) {
                    if (response.success) {
                        const ventas = response.data;
                        table.clear().rows.add(ventas).draw();

                        // Calcular métricas
                        let totalVentas = 0;
                        let totalEfectivo = 0;
                        let totalOnline = 0;

                        ventas.forEach(function(v) {
                            if (v.estado === 1) {
                                totalVentas += v.total;
                                if (v.metodoPago && v.metodoPago.toUpperCase() === 'MIXTO') {
                                    totalEfectivo += v.montoEfectivo || 0;
                                    totalOnline += (v.montoYape || 0) + (v.montoTransferencia || 0) + (v.montoTarjeta || 0);
                                } else if (v.metodoPago && v.metodoPago.toUpperCase() !== 'EFECTIVO') {
                                    totalOnline += v.total;
                                } else {
                                    totalEfectivo += v.total;
                                }
                            }
                        });

                        $('#metricTotalVentas').text('S/ ' + totalVentas.toFixed(2));
                        $('#metricTotalEfectivo').text('S/ ' + totalEfectivo.toFixed(2));
                        $('#metricTotalOnline').text('S/ ' + totalOnline.toFixed(2));
                    }
                },
                error: function() {
                    Swal.fire('Error', 'No se pudieron recuperar las transacciones', 'error');
                }
            });
        }

        $('#btnFiltrar').click(cargarDatos);
        cargarDatos();

        // Exportar a Excel
        $('#btnExportarExcel').click(function() {
            const query = $.param({
                fechaInicio: $('#fechaInicio').val(),
                fechaFin: $('#fechaFin').val(),
                metodoPago: $('#metodoPago').val(),
                estado: $('#estadoFilter').val()
            });
            window.location.href = '/reportes/ventas/exportar/excel?' + query;
        });

        // Exportar a PDF
        $('#btnExportarPdf').click(function() {
            const query = $.param({
                fechaInicio: $('#fechaInicio').val(),
                fechaFin: $('#fechaFin').val(),
                metodoPago: $('#metodoPago').val(),
                estado: $('#estadoFilter').val()
            });
            window.location.href = '/reportes/ventas/exportar/pdf?' + query;
        });
    });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario y Kárdex - Pernos Vega</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.7/css/dataTables.bootstrap5.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/responsive/2.5.0/css/responsive.bootstrap5.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <style>
        .table img {
            object-fit: cover;
            border: 2px solid #e9ecef;
        }

        .status-badge {
            font-size: 0.82rem;
            font-weight: 600;
            padding: 0.3em 0.6em;
        }

        .modal-xl {
            max-width: 1200px;
        }
    </style>
</head>

<body>
    <div class="wrapper">
        <div th:replace="~{sidebar :: sidebar('/inventario/listar')}"></div>

        <div class="main-content">
            <header class="main-header d-flex justify-content-between align-items-center">
                <div class="header-title">
                    <h1 class="h4 mb-0 fw-bold">Control de Inventario</h1>
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb small mb-0">
                            <li class="breadcrumb-item"><a th:href="@{/dashboard}">Dashboard</a></li>
                            <li class="breadcrumb-item active">Inventario</li>
                        </ol>
                    </nav>
                </div>
            </header>

            <!-- Tabla Principal de Productos para Inventario -->
            <div class="p-4">
                <div class="card border-0 shadow-sm">
                    <div class="card-body p-4">
                        <div class="d-flex align-items-center justify-content-between flex-wrap gap-2 mb-3">
                            <span class="fw-600 text-secondary" style="font-size:0.82rem;">Stock de Productos</span>
                            <div class="search-bar">
                                <i class="bi bi-search search-icon"></i>
                                <input type="text" id="buscadorInventario" class="form-control form-control-sm" placeholder="Buscar producto..." style="width:220px;">
                            </div>
                        </div>
                        <table id="tablaInventario" class="table table-hover w-100 align-middle">
                            <thead>
                                <tr>
                                    <th>Imagen</th>
                                    <th>Producto</th>
                                    <th>Stock Actual</th>
                                    <th>Stock Mínimo</th>
                                    <th>Estado Alerta</th>
                                    <th class="text-center">Acciones</th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ==========================================
         MODAL: HISTORIAL DE VENTAS POR PRODUCTO (Estilo image_c3b31d.jpg)
         ========================================== -->
    <div class="modal fade" id="historialVentasModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-xl modal-dialog-scrollable">
            <div class="modal-content border-0 shadow-lg">
                <div class="modal-header bg-white border-bottom py-3">
                    <h5 class="modal-title text-dark d-flex align-items-center gap-2 fw-bold"
                        style="font-size: 1.15rem;">
                        <i class="bi bi-graph-up-arrow text-success"></i>
                        Historial de Ventas - <span id="txtNombreProductoHeader"
                            class="text-secondary fw-normal">...</span>
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4">
                    <div class="table-responsive">
                        <table class="table table-sm align-middle table-hover text-center table-bordered small"
                            id="tablaHistorialVentas">
                            <thead class="table-light text-secondary text-uppercase" style="font-size: 0.75rem;">
                                <tr>
                                    <th>ID Venta</th>
                                    <th>N° Doc</th>
                                    <th>Fecha</th>
                                    <th>Cliente</th>
                                    <th>Vendedor</th>
                                    <th>F. Pago</th>
                                    <th>Cantidad</th>
                                    <th>Precio Unit.</th>
                                    <th>Subtotal</th>
                                    <th>Estado</th>
                                </tr>
                            </thead>
                            <tbody id="listaHistorialVentas">
                                <!-- Filas cargadas dinámicamente -->
                            </tbody>
                        </table>
                    </div>

                    <!-- Resumen Inferior (Como en la captura de tu compañero) -->
                    <div class="d-flex justify-content-between align-items-center mt-3 pt-3 border-top">
                        <span class="text-muted small" id="lblContadorVentas">0 venta(s) encontrada(s)</span>
                        <div class="h5 mb-0 fw-bold text-dark">
                            Total vendido: <span class="text-success" id="lblTotalVendidoGlobal">S/. 0.00</span>
                        </div>
                    </div>
                </div>
                <div class="modal-footer bg-light border-top gap-2">
                    <button type="button" class="btn btn-danger btn-sm d-flex align-items-center gap-1"><i
                            class="bi bi-file-earmark-pdf"></i> PDF</button>
                    <button type="button" class="btn btn-success btn-sm d-flex align-items-center gap-1"><i
                            class="bi bi-file-earmark-excel"></i> Excel</button>
                    <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cerrar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.7/js/dataTables.bootstrap5.min.js"></script>
    <script src="https://cdn.datatables.net/responsive/2.5.0/js/dataTables.responsive.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script th:src="@{/js/main.js}"></script>
    <script th:src="@{/js/inventario.js}"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuentas por Pagar - Pernos Vega</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.7/css/dataTables.bootstrap5.min.css">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>
<body>
<div class="wrapper">
    <div th:replace="~{sidebar :: sidebar('/cuentas-pagar/listar')}"></div>
    <div class="main-content">
        <header class="main-header d-flex justify-content-between align-items-center">
            <div class="header-title">
                <h1 class="h4 mb-0 fw-bold">Cuentas por Pagar</h1>
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb small mb-0">
                        <li class="breadcrumb-item"><a th:href="@{/dashboard}">Dashboard</a></li>
                        <li class="breadcrumb-item active">Cuentas por Pagar</li>
                    </ol>
                </nav>
            </div>
            <button class="btn btn-primary btn-sm" id="btnNuevaObligacion">
                <i class="bi bi-plus-lg me-1"></i> Nueva obligación
            </button>
        </header>
        <div class="p-4">
            <div class="card border-0 shadow-sm">
                <div class="card-body p-4">
                    <table id="tablaCuentasPagar" class="table table-hover w-100">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Proveedor</th>
                                <th>Monto Total</th>
                                <th>Saldo Pendiente</th>
                                <th>Estado</th>
                                <th class="text-center">Acciones</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="modalNuevaObligacion" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title">Registrar factura / obligación</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label small fw-bold">Proveedor</label>
                    <select class="form-select" id="selectProveedor" required>
                        <option value="">Seleccione...</option>
                        <option th:each="p : ${proveedores}" th:value="${p.id}" th:text="${p.nombre + ' (' + p.documento + ')'}"></option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-bold">Monto total (S/)</label>
                    <input type="number" class="form-control" id="inputMontoTotal" min="0.01" step="0.01">
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" class="btn btn-primary" id="btnGuardarObligacion">Guardar</button>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="modalPagoPagar" tabindex="-1">
    <div class="modal-dialog modal-sm">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Registrar pago a proveedor</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="pagoObligacionId">
                <label class="form-label small">Monto a pagar (S/)</label>
                <input type="number" class="form-control" id="pagoObligacionMonto" min="0.01" step="0.01">
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-primary w-100" id="btnConfirmarPagoProveedor">Confirmar pago</button>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.7/js/dataTables.bootstrap5.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script th:src="@{/js/main.js}"></script>
<script th:src="@{/js/cuentas-pagar.js}"></script>
</body>
</html>

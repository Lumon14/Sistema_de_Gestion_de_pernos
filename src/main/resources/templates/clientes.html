<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Clientes - Pernos Vega</title>

    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- DataTables CSS -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.7/css/dataTables.bootstrap5.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/responsive/2.5.0/css/responsive.bootstrap5.min.css">
    <!-- SweetAlert2 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">

    <!-- Estilos Personalizados -->
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>

<body>
    <div class="wrapper">
        <!-- Sidebar Fragment -->
        <div th:replace="~{sidebar :: sidebar('/clientes/listar')}"></div>

        <!-- Contenido Principal -->
        <div class="main-content">
            <!-- Top Navbar -->
            <header class="main-header d-flex justify-content-between align-items-center">
                <button id="open-sidebar" class="btn btn-link text-dark d-lg-none">
                    <i class="bi bi-list fs-3"></i>
                </button>
                <div class="header-title">
                    <h1 class="h4 mb-0 fw-bold">Gestión de Clientes</h1>
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb small mb-0">
                            <li class="breadcrumb-item"><a th:href="@{/dashboard}">Dashboard</a></li>
                            <li class="breadcrumb-item active">Clientes</li>
                        </ol>
                    </nav>
                </div>
                <div class="header-actions">
                    <button class="btn btn-primary d-flex align-items-center gap-2 shadow-sm" id="btnNuevoCliente">
                        <i class="bi bi-person-plus-fill"></i>
                        <span class="d-none d-sm-inline">Nuevo Cliente</span>
                    </button>
                </div>
            </header>

            <!-- Dashboard Content -->
            <div class="p-4">
                <div class="card border-0 shadow-sm">
                    <div class="card-body p-4">
                        <table id="tablaClientes" class="table table-hover w-100">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>DNI / RUC</th>
                                    <th>Nombre Completo</th>
                                    <th>Teléfono</th>
                                    <th>Email</th>
                                    <th>Estado</th>
                                    <th class="text-center">Acciones</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- Cargado por DataTables -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Cliente -->
    <div class="modal fade" id="clienteModal" tabindex="-1" aria-labelledby="modalTitle" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content border-0 shadow">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title" id="modalTitle">Nuevo Cliente</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="formCliente" novalidate>
                    <div class="modal-body p-4">
                        <input type="hidden" id="id">
                        
                        <div class="mb-3">
                            <label for="dniRuc" class="form-label small fw-bold">DNI o RUC</label>
                            <div class="input-group">
                                <input type="text" class="form-control" id="dniRuc" name="dniRuc" maxlength="11" inputmode="numeric" autocomplete="off">
                                <button class="btn btn-outline-primary" type="button" id="btnBuscarDni">
                                    <i class="bi bi-search"></i> Consultar
                                </button>
                            </div>
                            <div class="invalid-feedback d-block" id="dniRuc-error"></div>
                        </div>

                        <div class="mb-3">
                            <label for="nombre" class="form-label small fw-bold">Nombre Completo</label>
                            <input type="text" class="form-control" id="nombre" name="nombre" maxlength="100" autocomplete="off">
                            <div class="invalid-feedback d-block" id="nombre-error"></div>
                        </div>

                        <div class="mb-3">
                            <label for="telefono" class="form-label small fw-bold">Teléfono</label>
                            <input type="text" class="form-control" id="telefono" name="telefono" maxlength="9" inputmode="numeric" autocomplete="off">
                            <div class="invalid-feedback d-block" id="telefono-error"></div>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label small fw-bold">Correo Electrónico</label>
                            <input type="email" class="form-control" id="email" name="email" maxlength="100" autocomplete="off">
                            <div class="invalid-feedback d-block" id="email-error"></div>
                        </div>

                        <div class="mb-3">
                            <label for="direccion" class="form-label small fw-bold">Dirección</label>
                            <textarea class="form-control" id="direccion" name="direccion" rows="2" maxlength="255"></textarea>
                        </div>
                    </div>
                    <div class="modal-footer bg-light">
                        <button type="button" class="btn btn-secondary px-4" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary px-4">Guardar Cliente</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- CSRF Meta Tags -->
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.7/js/dataTables.bootstrap5.min.js"></script>
    <script src="https://cdn.datatables.net/responsive/2.5.0/js/dataTables.responsive.min.js"></script>
    <script src="https://cdn.datatables.net/responsive/2.5.0/js/responsive.bootstrap5.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script th:src="@{/js/main.js}"></script>
    <script th:src="@{/js/clientes.js}"></script>
</body>

</html>

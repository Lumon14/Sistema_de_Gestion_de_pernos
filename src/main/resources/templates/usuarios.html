<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Usuarios - Pernos Vega</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/responsive/2.5.0/css/responsive.bootstrap5.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <!-- CSRF Token -->
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>
<body>

<div class="d-flex">
    <!-- Sidebar -->
    <div th:replace="~{sidebar :: sidebar(activeUri='/usuarios/listar')}"></div>

    <!-- Main content -->
    <div id="main-content" class="main-content w-100">

        <!-- Topbar -->
        <header class="topbar">
            <div class="d-flex align-items-center gap-3">
                <button id="open-sidebar" class="btn btn-sm btn-light d-md-none p-1 px-2">
                    <i class="bi bi-list fs-5"></i>
                </button>
                <h1 class="topbar-title">Gestión de Usuarios</h1>
            </div>
            <button id="btnNuevoRegistro" class="btn-primary-custom">
                <i class="bi bi-plus-lg"></i> Nuevo Registro
            </button>
        </header>

        <!-- Contenido -->
        <main class="p-4 fade-in-up">
            <div class="table-wrapper">
                <div class="p-3 border-bottom d-flex align-items-center justify-content-between flex-wrap gap-2">
                    <span class="fw-600 text-secondary" style="font-size:0.82rem;">Lista de Usuarios</span>
                    <div class="search-bar">
                        <i class="bi bi-search search-icon"></i>
                        <input type="text" id="buscadorUsuarios" class="form-control form-control-sm" placeholder="Buscar usuario..." style="width:220px;">
                    </div>
                </div>
                <table id="tablaUsuarios" class="table table-hover responsive" style="width:100%">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Usuario</th>
                            <th>Perfil</th>
                            <th>Correo</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </main>
    </div>
</div>

<!-- Modal Formulario -->
<div class="modal fade" id="usuarioModal" tabindex="-1" aria-labelledby="modalTitle" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalTitle"><i class="bi bi-person-plus me-2"></i>Agregar Usuario</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="formUsuario" novalidate>
                    <input type="hidden" id="id" name="id">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="nombre" class="form-label">Nombre completo</label>
                            <input type="text" id="nombre" name="nombre" class="form-control"
                                placeholder="Ej: AdminLuz" pattern="[A-Za-z]+"
                                title="Solo letras mayúsculas y minúsculas" autocomplete="off">
                            <div id="nombre-error" class="invalid-feedback d-block"></div>
                        </div>
                        <div class="col-md-6">
                            <label for="usuario" class="form-label">Usuario</label>
                            <input type="text" id="usuario" name="usuario" class="form-control"
                                placeholder="Ej: admin" pattern="[A-Za-z]+"
                                title="Solo letras mayúsculas y minúsculas" autocomplete="off">
                            <div id="usuario-error" class="invalid-feedback d-block"></div>
                        </div>
                        <div class="col-md-6">
                            <label for="clave" class="form-label">Contraseña</label>
                            <input type="password" id="clave" name="clave" class="form-control" placeholder="••••••••">
                            <div id="clave-error" class="invalid-feedback d-block"></div>
                        </div>
                        <div class="col-md-6">
                            <label for="correo" class="form-label">Correo Electrónico</label>
                            <input type="email" id="correo" name="correo" class="form-control" placeholder="correo@ejemplo.com">
                            <div id="correo-error" class="invalid-feedback d-block"></div>
                        </div>
                        <div class="col-md-6">
                            <label for="id_perfil" class="form-label">Perfil</label>
                            <select id="id_perfil" name="id_perfil" class="form-select">
                                <!-- Se carga dinámicamente -->
                            </select>
                            <div id="id_perfil-error" class="invalid-feedback d-block"></div>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="submit" form="formUsuario" class="btn btn-primary">
                    <i class="bi bi-floppy me-1"></i> Guardar Usuario
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Toast container -->
<div id="notification-container" class="toast-container position-fixed top-0 end-0 p-3"></div>

<!-- Scripts -->
<script src="https://code.jquery.com/jquery-3.7.0.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
<script src="https://cdn.datatables.net/responsive/2.5.0/js/dataTables.responsive.min.js"></script>
<script src="https://cdn.datatables.net/responsive/2.5.0/js/responsive.bootstrap5.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script th:src="@{/js/main.js}"></script>
<script th:src="@{/js/usuarios.js}"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuentas por Cobrar - Pernos Vega</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.7/css/dataTables.bootstrap5.min.css">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>
<body>
<div class="wrapper">
    <div th:replace="~{sidebar :: sidebar('/cuentas-cobrar/listar')}"></div>
    <div class="main-content">
        <header class="main-header d-flex justify-content-between align-items-center">
            <div class="header-title">
                <h1 class="h4 mb-0 fw-bold">Cuentas por Cobrar</h1>
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb small mb-0">
                        <li class="breadcrumb-item"><a th:href="@{/dashboard}">Dashboard</a></li>
                        <li class="breadcrumb-item active">Cuentas por Cobrar</li>
                    </ol>
                </nav>
            </div>
            <button class="btn btn-primary btn-sm" id="btnNuevaCuenta">
                <i class="bi bi-plus-lg me-1"></i> Generar desde venta
            </button>
        </header>
        <div class="p-4">
            <div class="card border-0 shadow-sm">
                <div class="card-body p-4">
                    <table id="tablaCuentasCobrar" class="table table-hover w-100">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Cliente</th>
                                <th>Venta / Comprobante</th>
                                <th>Fecha Registro</th>
                                <th>Fecha Vencimiento</th>
                                <th>Saldo Pendiente</th>
                                <th>Estado</th>
                                <th class="text-center">Acciones</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="modalNuevaCuenta" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title">Generar cuenta desde venta</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <label class="form-label small fw-bold">Seleccione venta</label>
                <select class="form-select" id="selectVentaCuenta">
                    <option value="">Cargando ventas...</option>
                </select>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" class="btn btn-primary" id="btnConfirmarGenerar">Generar cuenta</button>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="modalPagoCobrar" tabindex="-1">
    <div class="modal-dialog modal-sm">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Registrar cobro</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="pagoCuentaId">
                <label class="form-label small">Monto a cobrar (S/)</label>
                <input type="number" class="form-control" id="pagoMonto" min="0.01" step="0.01">
                <label class="form-label small mt-2">Método de pago</label>
                <select class="form-select" id="pagoMetodo">
                    <option value="EFECTIVO">Efectivo</option>
                    <option value="TRANSFERENCIA">Transferencia</option>
                    <option value="YAPE">Yape / Plin</option>
                    <option value="TARJETA">Tarjeta</option>
                </select>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-primary w-100" id="btnConfirmarPago">Confirmar cobro</button>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.7/js/dataTables.bootstrap5.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script th:src="@{/js/main.js}"></script>
<script th:src="@{/js/cuentas-cobrar.js}"></script>
</body>
</html>

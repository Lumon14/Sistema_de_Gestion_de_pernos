<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuentas por Cobrar - Pernos Vega</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.7/css/dataTables.bootstrap5.min.css">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>
<body>
<div class="wrapper">
    <div th:replace="~{sidebar :: sidebar('/cuentas-cobrar/listar')}"></div>
    <div class="main-content">
        <header class="main-header d-flex justify-content-between align-items-center">
            <div class="header-title">
                <h1 class="h4 mb-0 fw-bold">Cuentas por Cobrar</h1>
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb small mb-0">
                        <li class="breadcrumb-item"><a th:href="@{/dashboard}">Dashboard</a></li>
                        <li class="breadcrumb-item active">Cuentas por Cobrar</li>
                    </ol>
                </nav>
            </div>
            <button class="btn btn-primary btn-sm" id="btnNuevaCuenta">
                <i class="bi bi-plus-lg me-1"></i> Generar desde venta
            </button>
        </header>
        <div class="p-4">
            <div class="card border-0 shadow-sm">
                <div class="card-body p-4">
                    <table id="tablaCuentasCobrar" class="table table-hover w-100">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Cliente</th>
                                <th>Venta / Comprobante</th>
                                <th>Fecha Registro</th>
                                <th>Fecha Vencimiento</th>
                                <th>Saldo Pendiente</th>
                                <th>Estado</th>
                                <th class="text-center">Acciones</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="modalNuevaCuenta" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title">Generar cuenta desde venta</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <label class="form-label small fw-bold">Seleccione venta</label>
                <select class="form-select" id="selectVentaCuenta">
                    <option value="">Cargando ventas...</option>
                </select>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" class="btn btn-primary" id="btnConfirmarGenerar">Generar cuenta</button>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="modalPagoCobrar" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content border-0 shadow">
            <div class="modal-header bg-dark text-white">
                <h5 class="modal-title"><i class="bi bi-wallet2 me-2"></i>Registrar cobro</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-4">
                <input type="hidden" id="pagoCuentaId">
                <div class="mb-3">
                    <label class="form-label small fw-bold">Saldo Pendiente (S/)</label>
                    <input type="text" class="form-control bg-light fw-bold" id="saldoPendienteDisplay" readonly>
                </div>
                
                <div class="card border-0 bg-light p-3 mb-3">
                    <h6 class="small fw-bold mb-3 text-primary"><i class="bi bi-cash-coin me-1"></i>Distribución del Pago</h6>
                    
                    <div class="row g-2 mb-2">
                        <div class="col-6">
                            <label class="form-label small fw-semibold">Efectivo (S/)</label>
                            <input type="number" class="form-control form-control-sm input-distribucion-pago" id="pagoEfectivo" min="0" step="0.01" value="0.00">
                        </div>
                        <div class="col-6">
                            <label class="form-label small fw-semibold">Yape / Plin (S/)</label>
                            <input type="number" class="form-control form-control-sm input-distribucion-pago" id="pagoYape" min="0" step="0.01" value="0.00">
                        </div>
                    </div>
                    <div class="row g-2">
                        <div class="col-6">
                            <label class="form-label small fw-semibold">Transferencia (S/)</label>
                            <input type="number" class="form-control form-control-sm input-distribucion-pago" id="pagoTransferencia" min="0" step="0.01" value="0.00">
                        </div>
                        <div class="col-6">
                            <label class="form-label small fw-semibold">Tarjeta (S/)</label>
                            <input type="number" class="form-control form-control-sm input-distribucion-pago" id="pagoTarjeta" min="0" step="0.01" value="0.00">
                        </div>
                    </div>
                </div>

                <div class="d-flex justify-content-between align-items-center border-top pt-2">
                    <div>
                        <span class="small text-muted d-block">Total Distribuido:</span>
                        <span class="fw-bold fs-5 text-dark" id="totalDistribuidoDisplay">S/ 0.00</span>
                    </div>
                    <div class="text-end">
                        <span class="small text-muted d-block">Restante:</span>
                        <span class="fw-bold fs-5 text-danger" id="restanteDisplay">S/ 0.00</span>
                    </div>
                </div>
                <div class="mt-3" id="alertaPagoDistribucion"></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" class="btn btn-primary" id="btnConfirmarPago" disabled>Confirmar cobro</button>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.7/js/dataTables.bootstrap5.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script th:src="@{/js/main.js}"></script>
<script th:src="@{/js/cuentas-cobrar.js}"></script>
</body>
</html>

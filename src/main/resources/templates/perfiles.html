<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Perfiles - Pernos Vega</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/responsive/2.5.0/css/responsive.bootstrap5.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <!-- CSRF Token -->
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>
<body>

<div class="d-flex">
    <div th:replace="~{sidebar :: sidebar(activeUri='/perfiles/listar')}"></div>

    <div id="main-content" class="main-content w-100">

        <!-- Topbar -->
        <header class="topbar">
            <div class="d-flex align-items-center gap-3">
                <button id="open-sidebar" class="btn btn-sm btn-light d-md-none p-1 px-2">
                    <i class="bi bi-list fs-5"></i>
                </button>
                <h1 class="topbar-title">Gestión de Perfiles</h1>
            </div>
            <button id="btnNuevoRegistro" class="btn-primary-custom">
                <i class="bi bi-plus-lg"></i> Nuevo Perfil
            </button>
        </header>

        <main class="p-4 fade-in-up">
            <div class="table-wrapper">
                <div class="p-3 border-bottom d-flex align-items-center justify-content-between flex-wrap gap-2">
                    <span class="fw-600 text-secondary" style="font-size:0.82rem;">Lista de Roles y Permisos</span>
                    <div class="search-bar">
                        <i class="bi bi-search search-icon"></i>
                        <input type="text" id="buscadorPerfiles" class="form-control form-control-sm" placeholder="Buscar perfil..." style="width:220px;">
                    </div>
                </div>
                <table id="tablaPerfiles" class="table table-hover responsive" style="width:100%">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Descripción</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </main>
    </div>
</div>

<!-- Modal Formulario -->
<div class="modal fade" id="perfilModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title"><i class="bi bi-person-badge me-2"></i>Datos del Perfil</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="formPerfil" novalidate>
                    <input type="hidden" id="id" name="id">
                    <div class="mb-3">
                        <label for="nombre" class="form-label">Nombre del Perfil</label>
                        <input type="text" id="nombre" name="nombre" class="form-control" placeholder="Ej: Vendedor" required>
                        <div id="nombre-error" class="invalid-feedback d-block"></div>
                    </div>
                    <div class="mb-3">
                        <label for="descripcion" class="form-label">Descripción</label>
                        <textarea id="descripcion" name="descripcion" class="form-control" rows="3" placeholder="¿Qué puede hacer este perfil?"></textarea>
                        <div id="descripcion-error" class="invalid-feedback d-block"></div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="submit" form="formPerfil" class="btn btn-primary">
                    <i class="bi bi-floppy me-1"></i> Guardar Perfil
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Modal Permisos -->
<div class="modal fade" id="permisosModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header" style="background: linear-gradient(135deg, #6366f1, #4f46e5);">
                <h5 class="modal-title text-white"><i class="bi bi-shield-lock me-2"></i>Asignar Permisos</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="formPermisos">
                    <input type="hidden" id="permisoPerfilId">
                    <p class="small text-muted mb-3">Seleccione los módulos a los que tendrá acceso <strong id="permisoPerfilNombre"></strong>:</p>
                    <div id="listaOpciones" class="list-group list-group-flush border rounded-3">
                        <!-- Dinámico -->
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                <button type="button" id="btnGuardarPermisos" class="btn btn-primary">
                    <i class="bi bi-check2-circle me-1"></i> Aplicar Cambios
                </button>
            </div>
        </div>
    </div>
</div>

<div id="notification-container" class="toast-container position-fixed top-0 end-0 p-3"></div>

<script src="https://code.jquery.com/jquery-3.7.0.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script th:src="@{/js/main.js}"></script>
<script th:src="@{/js/perfiles.js}"></script>
</body>
</html>

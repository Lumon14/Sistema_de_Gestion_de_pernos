<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facturas - Pernos Vega</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.7/css/dataTables.bootstrap5.min.css">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <style>
        .btn-whatsapp { background-color: #25d366; color: white; border: none; }
        .btn-whatsapp:hover { background-color: #1da851; color: white; }
        .btn-pdf { background-color: #dc3545; color: white; border: none; }
        .btn-pdf:hover { background-color: #b02a37; color: white; }
        .btn-email { background-color: #6f42c1; color: white; border: none; }
        .btn-email:hover { background-color: #59359a; color: white; }
    </style>
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>
<body>
<div class="wrapper">
    <div th:replace="~{sidebar :: sidebar('/ventas/facturas/listar')}"></div>
    <div class="main-content">
        <header class="main-header d-flex justify-content-between align-items-center">
            <div class="header-title">
                <h1 class="h4 mb-0 fw-bold">Facturas de Venta</h1>
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb small mb-0">
                        <li class="breadcrumb-item"><a th:href="@{/dashboard}">Dashboard</a></li>
                        <li class="breadcrumb-item">Ventas</li>
                        <li class="breadcrumb-item active">Facturas</li>
                    </ol>
                </nav>
            </div>
        </header>
        <div class="p-4">
            <div class="card border-0 shadow-sm">
                <div class="card-body p-4">
                    <div class="d-flex justify-content-between flex-wrap gap-2 mb-3">
                        <span class="fw-600 text-secondary" style="font-size:0.82rem;">Comprobantes tipo Factura (con IGV)</span>
                        <div class="search-bar">
                            <i class="bi bi-search search-icon"></i>
                            <input type="text" id="buscadorVentas" class="form-control form-control-sm" placeholder="Buscar factura..." style="width:220px;">
                        </div>
                    </div>
                    <table id="tablaVentas" class="table table-hover w-100">
                        <thead>
                            <tr>
                                <th>Comprobante</th>
                                <th>Fecha</th>
                                <th>Cliente</th>
                                <th>Vendedor</th>
                                <th>Total</th>
                                <th>Estado</th>
                                <th class="text-center">Acciones</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Modal Ver Factura -->
<div class="modal fade" id="verVentaModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content border-0">
            <div class="modal-header">
                <h5 class="modal-title">Detalle de Factura #<span id="verVentaId"></span></h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="verVentaContent"></div>
            <div class="modal-footer border-0 flex-wrap gap-2">
                <button type="button" class="btn btn-whatsapp" id="btnCompartirWhatsApp">
                    <i class="bi bi-whatsapp"></i> Enviar WhatsApp
                </button>
                <button type="button" class="btn btn-pdf" id="btnDescargarPDF">
                    <i class="bi bi-file-earmark-pdf-fill"></i> Descargar PDF
                </button>
                <button type="button" class="btn btn-email" id="btnEnviarCorreo">
                    <i class="bi bi-envelope-fill"></i> Enviar por Correo
                </button>
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cerrar</button>
            </div>
        </div>
    </div>
</div>

<!-- Modal Enviar Correo -->
<div class="modal fade" id="emailModal" tabindex="-1" aria-labelledby="emailModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow">
            <div class="modal-header" style="background: linear-gradient(135deg, #6f42c1, #4c2c8d); color: white;">
                <h5 class="modal-title" id="emailModalLabel">
                    <i class="bi bi-envelope-fill me-2"></i>Enviar Factura
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-4">
                <div class="text-center mb-3">
                    <i class="bi bi-envelope-check-fill" style="font-size: 2.5rem; color: #6f42c1;"></i>
                </div>
                <p class="text-center mb-1 fw-semibold fs-6" id="emailModalPregunta">¿Desea enviar la Factura a este correo?</p>
                <div class="alert alert-light border text-center py-2 mt-2" id="emailModalCorreoDisplay">
                    <i class="bi bi-person-circle me-1 text-muted"></i>
                    <span id="emailModalCorreoTexto" class="fw-bold text-dark">—</span>
                </div>
                <div id="emailActualizarForm" class="d-none mt-3">
                    <label class="form-label small fw-bold">Nuevo correo electrónico</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                        <input type="email" class="form-control" id="nuevoCorreoInput" placeholder="nuevo@correo.com">
                    </div>
                    <div class="d-flex gap-2 mt-2">
                        <button type="button" class="btn btn-success btn-sm w-100" id="btnGuardarNuevoCorreo">
                            <i class="bi bi-check-lg"></i> Guardar y continuar
                        </button>
                        <button type="button" class="btn btn-outline-secondary btn-sm" id="btnCancelarActualizarCorreo">
                            Cancelar
                        </button>
                    </div>
                </div>
            </div>
            <div class="modal-footer justify-content-between flex-wrap gap-2">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal" id="btnEmailCancelar">
                    <i class="bi bi-x-lg"></i> Cancelar
                </button>
                <div class="d-flex gap-2">
                    <button type="button" class="btn btn-outline-warning" id="btnActualizarCorreo">
                        <i class="bi bi-pencil-fill"></i> Actualizar Correo
                    </button>
                    <button type="button" class="btn btn-primary" id="btnSiEnviar">
                        <i class="bi bi-send-fill"></i> Sí, Enviar
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.7/js/dataTables.bootstrap5.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script th:inline="javascript">
    window.VENTAS_CONFIG = {
        tipoVista: 'facturas',
        apiListar: '/ventas/api/facturas/listar',
        permitirCrear: false,
        permitirCanje: false
    };
</script>
<script th:src="@{/js/main.js}"></script>
<script th:src="@{/js/ventas.js}"></script>
</body>
</html>

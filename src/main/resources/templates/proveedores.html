<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Proveedores - Pernos Vega</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/responsive/2.5.0/css/responsive.bootstrap5.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <!-- CSRF Token -->
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>
<body>

<div class="d-flex">
    <div th:replace="~{sidebar :: sidebar(activeUri='/proveedores/listar')}"></div>

    <div id="main-content" class="main-content w-100">

        <header class="topbar">
            <div class="d-flex align-items-center gap-3">
                <button id="open-sidebar" class="btn btn-sm btn-light d-md-none p-1 px-2">
                    <i class="bi bi-list fs-5"></i>
                </button>
                <h1 class="topbar-title">Gestión de Proveedores</h1>
            </div>
            <button id="btnNuevoProveedor" class="btn-primary-custom">
                <i class="bi bi-plus-lg"></i> Nuevo Proveedor
            </button>
        </header>

        <main class="p-4 fade-in-up">
            <div class="table-wrapper">
                <div class="p-3 border-bottom d-flex align-items-center justify-content-between flex-wrap gap-2">
                    <span class="fw-600 text-secondary" style="font-size:0.82rem;">Directorio de Proveedores</span>
                    <div class="search-bar">
                        <i class="bi bi-search search-icon"></i>
                        <input type="text" id="buscadorProveedores" class="form-control form-control-sm" placeholder="Buscar proveedor..." style="width:220px;">
                    </div>
                </div>
                <table id="tablaProveedores" class="table table-hover responsive" style="width:100%">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>RUC / DNI</th>
                            <th>Razón Social</th>
                            <th>Dirección</th>
                            <th>Teléfono</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </main>
    </div>
</div>

<!-- Modal -->
<div class="modal fade" id="proveedorModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title"><i class="bi bi-truck me-2"></i>Datos del Proveedor</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="formProveedor">
                    <input type="hidden" id="id">
                    <div class="mb-3">
                        <label class="form-label">RUC / DNI</label>
                        <input type="text" id="documento" class="form-control" placeholder="Ej: 20601234567" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Razón Social / Nombre</label>
                        <input type="text" id="nombre" class="form-control" placeholder="Nombre de la empresa o proveedor" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Dirección</label>
                        <input type="text" id="direccion" class="form-control" placeholder="Dirección fiscal">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Teléfono / Celular</label>
                        <input type="text" id="telefono" class="form-control" placeholder="987654321">
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="submit" form="formProveedor" class="btn btn-primary">
                    <i class="bi bi-floppy me-1"></i> Guardar Proveedor
                </button>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.0.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script th:src="@{/js/main.js}"></script>
<script th:src="@{/js/proveedores.js}"></script>
</body>
</html>

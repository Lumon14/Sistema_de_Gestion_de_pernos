<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Pedidos - Pernos Vega</title>

    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- DataTables CSS -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.7/css/dataTables.bootstrap5.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/responsive/2.5.0/css/responsive.bootstrap5.min.css">
    <!-- SweetAlert2 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">

    <!-- Estilos Personalizados -->
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <style>
        .badge-pendiente {
            background-color: #ffeeb3;
            color: #856404;
        }
        .badge-completado {
            background-color: #d4edda;
            color: #155724;
        }
        .badge-cancelado {
            background-color: #f8d7da;
            color: #721c24;
        }
    </style>
</head>

<body>
    <div class="wrapper">
        <!-- Sidebar Fragment -->
        <div th:replace="~{sidebar :: sidebar('/pedidos/listar')}"></div>

        <!-- Contenido Principal -->
        <div class="main-content">
            <!-- Top Navbar -->
            <header class="main-header d-flex justify-content-between align-items-center">
                <button id="open-sidebar" class="btn btn-link text-dark d-lg-none">
                    <i class="bi bi-list fs-3"></i>
                </button>
                <div class="header-title">
                    <h1 class="h4 mb-0 fw-bold">Gestión de Pedidos</h1>
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb small mb-0">
                            <li class="breadcrumb-item"><a th:href="@{/dashboard}">Dashboard</a></li>
                            <li class="breadcrumb-item active">Pedidos</li>
                        </ol>
                    </nav>
                </div>
            </header>

            <!-- Dashboard Content -->
            <div class="p-4">
                <div class="card border-0 shadow-sm">
                    <div class="card-body p-4">
                        <div class="d-flex align-items-center justify-content-between flex-wrap gap-2 mb-3">
                            <span class="fw-600 text-secondary" style="font-size:0.82rem;">Lista de Pedidos</span>
                            <div class="search-bar">
                                <i class="bi bi-search search-icon"></i>
                                <input type="text" id="buscadorPedidos" class="form-control form-control-sm" placeholder="Buscar pedido..." style="width:220px;">
                            </div>
                        </div>
                        <table id="tablaPedidos" class="table table-hover w-100">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Fecha</th>
                                    <th>Cliente</th>
                                    <th>DNI/RUC</th>
                                    <th>Teléfono</th>
                                    <th>Total</th>
                                    <th>Estado</th>
                                    <th class="text-center">Acciones</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- Cargado por DataTables -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Detalle Pedido -->
    <div class="modal fade" id="verPedidoModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content border-0 shadow">
                <div class="modal-header bg-dark text-white">
                    <h5 class="modal-title"><i class="bi bi-clock-history me-2"></i>Detalle de Pedido #<span id="verPedidoId"></span></h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4" id="verPedidoContent">
                    <!-- Contenido dinámico por JS -->
                </div>
                <div class="modal-footer bg-light border-0">
                    <div id="modalActionButtons" class="d-flex gap-2 w-100 justify-content-end">
                        <!-- Botones dinámicos por JS según estado del pedido -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Editar Pedido -->
    <div class="modal fade" id="editarPedidoModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content border-0 shadow">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title"><i class="bi bi-pencil-square me-2"></i>Editar Pedido #<span id="editPedidoIdLabel"></span></h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="formEditarPedido">
                    <input type="hidden" id="editPedidoId">
                    <div class="modal-body p-4">
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label small fw-bold">Cliente DNI/RUC</label>
                                <input type="text" class="form-control" id="editPedidoDniRuc" maxlength="11">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-bold">Nombre Cliente</label>
                                <input type="text" class="form-control" id="editPedidoNombre" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label small fw-bold">Teléfono</label>
                                <input type="text" class="form-control" id="editPedidoTelefono">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label small fw-bold">Correo</label>
                                <input type="email" class="form-control" id="editPedidoEmail">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label small fw-bold">Dirección</label>
                                <input type="text" class="form-control" id="editPedidoDireccion">
                            </div>
                        </div>
                        
                        <div class="border rounded p-3 bg-light mb-3">
                            <div class="row g-2 align-items-end">
                                <div class="col-md-6">
                                    <label class="form-label small fw-bold">Agregar Producto</label>
                                    <select class="form-select" id="editPedidoSelectProducto">
                                        <option value="">Seleccione producto...</option>
                                    </select>
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label small fw-bold">Cantidad</label>
                                    <input type="number" class="form-control" id="editPedidoCantidad" value="1" min="1">
                                </div>
                                <div class="col-md-3">
                                    <button type="button" class="btn btn-secondary w-100" id="btnEditPedidoAgregarItem">Agregar</button>
                                </div>
                            </div>
                        </div>

                        <div class="table-responsive" style="max-height: 250px;">
                            <table class="table table-sm table-bordered align-middle" id="editPedidoTablaDetalles">
                                <thead class="table-light">
                                    <tr>
                                        <th>Producto</th>
                                        <th class="text-end" style="width: 100px;">Precio Unit.</th>
                                        <th class="text-center" style="width: 80px;">Cant.</th>
                                        <th class="text-end" style="width: 100px;">Subtotal</th>
                                        <th class="text-center" style="width: 50px;">Acciones</th>
                                    </tr>
                                </thead>
                                <tbody></tbody>
                            </table>
                        </div>

                        <div class="d-flex justify-content-end mt-3 fs-5">
                            Total Pedido: <strong class="text-primary ms-2" id="editPedidoTotalLabel">S/ 0.00</strong>
                        </div>
                    </div>
                    <div class="modal-footer bg-light border-0">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary">Guardar Cambios</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- CSRF Meta Tags -->
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.7/js/dataTables.bootstrap5.min.js"></script>
    <script src="https://cdn.datatables.net/responsive/2.5.0/js/dataTables.responsive.min.js"></script>
    <script src="https://cdn.datatables.net/responsive/2.5.0/js/responsive.bootstrap5.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script th:src="@{/js/main.js}"></script>
    <script th:src="@{/js/pedidos.js}"></script>
</body>

</html>

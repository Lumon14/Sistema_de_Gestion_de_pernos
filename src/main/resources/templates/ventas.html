<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Ventas - Pernos Vega</title>

    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- DataTables CSS -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.7/css/dataTables.bootstrap5.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/responsive/2.5.0/css/responsive.bootstrap5.min.css">
    <!-- SweetAlert2 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <!-- Select2 (para búsqueda de productos y clientes) -->
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/select2-bootstrap-5-theme@1.3.0/dist/select2-bootstrap-5-theme.min.css" />

    <!-- Estilos Personalizados -->
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <style>
        .product-item {
            border-bottom: 1px solid #eee;
            padding: 10px 0;
        }
        .product-item:last-child {
            border-bottom: none;
        }
        .total-section {
            font-size: 1.25rem;
            font-weight: 700;
            color: #0d6efd;
        }
        .btn-whatsapp {
            background-color: #25d366;
            color: white;
            border: none;
        }
        .btn-whatsapp:hover {
            background-color: #128c7e;
            color: white;
        }
    </style>
</head>

<body>
    <div class="wrapper">
        <!-- Sidebar Fragment -->
        <div th:replace="~{sidebar :: sidebar('/ventas/listar')}"></div>

        <!-- Contenido Principal -->
        <div class="main-content">
            <!-- Top Navbar -->
            <header class="main-header d-flex justify-content-between align-items-center">
                <button id="open-sidebar" class="btn btn-link text-dark d-lg-none">
                    <i class="bi bi-list fs-3"></i>
                </button>
                <div class="header-title">
                    <h1 class="h4 mb-0 fw-bold">Gestión de Ventas</h1>
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb small mb-0">
                            <li class="breadcrumb-item"><a th:href="@{/dashboard}">Dashboard</a></li>
                            <li class="breadcrumb-item active">Ventas</li>
                        </ol>
                    </nav>
                </div>
                <div class="header-actions">
                    <button class="btn btn-primary d-flex align-items-center gap-2 shadow-sm" id="btnNuevaVenta">
                        <i class="bi bi-plus-circle-fill"></i>
                        <span class="d-none d-sm-inline">Nueva Nota de Venta</span>
                    </button>
                </div>
            </header>

            <!-- Dashboard Content -->
            <div class="p-4">
                <div class="card border-0 shadow-sm">
                    <div class="card-body p-4">
                        <table id="tablaVentas" class="table table-hover w-100">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Fecha</th>
                                    <th>Cliente</th>
                                    <th>Vendedor</th>
                                    <th>Total</th>
                                    <th>Estado</th>
                                    <th class="text-center">Acciones</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- Cargado por DataTables -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Nueva Venta -->
    <div class="modal fade" id="ventaModal" tabindex="-1" aria-labelledby="modalTitle" aria-hidden="true">
        <div class="modal-dialog modal-xl">
            <div class="modal-content border-0 shadow">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title" id="modalTitle">Nueva Nota de Venta</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4">
                    <form id="formVenta">
                        <div class="row g-3">
                            <!-- Datos del Cliente -->
                            <div class="col-md-6">
                                <div class="card bg-light border-0">
                                    <div class="card-body">
                                        <h6 class="fw-bold mb-3"><i class="bi bi-person-fill me-2"></i>Información del Cliente</h6>
                                        <div class="row g-2">
                                            <div class="col-12">
                                                <label class="form-label small fw-bold">Buscar por DNI o Nombre</label>
                                                <div class="input-group">
                                                    <select id="selectCliente" class="form-select select2-cliente" style="width: 100%;">
                                                        <option value="">Seleccione o busque un cliente...</option>
                                                    </select>
                                                </div>
                                            </div>
                                            <div class="col-12 mt-3 d-none" id="datosNuevoCliente">
                                                <div class="row g-2">
                                                    <div class="col-md-6">
                                                        <input type="text" class="form-control" id="clienteDni" placeholder="DNI">
                                                    </div>
                                                    <div class="col-md-6">
                                                        <input type="text" class="form-control" id="clienteNombre" placeholder="Nombre completo">
                                                    </div>
                                                    <div class="col-md-12">
                                                        <input type="text" class="form-control" id="clienteTelefono" placeholder="Teléfono">
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Resumen y Total -->
                            <div class="col-md-6">
                                <div class="card border-primary h-100">
                                    <div class="card-body d-flex flex-column justify-content-center text-center">
                                        <h6 class="text-muted mb-1 text-uppercase small fw-bold">Total a Pagar</h6>
                                        <div class="total-section mb-0">S/. <span id="totalVenta">0.00</span></div>
                                        <p class="small text-muted mt-2 mb-0" id="infoItems">0 productos seleccionados</p>
                                    </div>
                                </div>
                            </div>

                            <!-- Selección de Productos -->
                            <div class="col-12">
                                <div class="card border-0 bg-light">
                                    <div class="card-body">
                                        <h6 class="fw-bold mb-3"><i class="bi bi-box-seam-fill me-2"></i>Añadir Productos</h6>
                                        <div class="row g-2 align-items-end">
                                            <div class="col-md-6">
                                                <label class="form-label small fw-bold">Producto</label>
                                                <select id="selectProducto" class="form-select select2-producto" style="width: 100%;">
                                                    <option value="">Buscar producto...</option>
                                                    <option th:each="prod : ${productos}" 
                                                            th:value="${prod.id}" 
                                                            th:data-precio="${prod.precioVenta}"
                                                            th:data-stock="${prod.stock}"
                                                            th:text="${prod.nombre + ' (Stock: ' + prod.stock + ')'}"></option>
                                                </select>
                                            </div>
                                            <div class="col-md-2">
                                                <label class="form-label small fw-bold">Cantidad</label>
                                                <input type="number" id="inputCantidad" class="form-control" value="1" min="1">
                                            </div>
                                            <div class="col-md-2">
                                                <label class="form-label small fw-bold">Precio Unit.</label>
                                                <input type="text" id="inputPrecio" class="form-control" readonly>
                                            </div>
                                            <div class="col-md-2">
                                                <button type="button" class="btn btn-dark w-100" id="btnAgregarProducto">
                                                    <i class="bi bi-plus-lg"></i> Añadir
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Lista de Detalles -->
                            <div class="col-12">
                                <div class="table-responsive">
                                    <table class="table table-bordered align-middle" id="tablaDetalles">
                                        <thead class="table-light">
                                            <tr>
                                                <th>Producto</th>
                                                <th class="text-center" style="width: 150px;">Cantidad</th>
                                                <th class="text-end" style="width: 150px;">Precio</th>
                                                <th class="text-end" style="width: 150px;">Subtotal</th>
                                                <th class="text-center" style="width: 50px;"></th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <!-- Items añadidos dinámicamente -->
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer bg-light p-4">
                    <button type="button" class="btn btn-secondary px-4" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary px-4" id="btnProcesarVenta">Procesar Venta</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Ver Venta -->
    <div class="modal fade" id="verVentaModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content border-0">
                <div class="modal-header">
                    <h5 class="modal-title">Detalle de Venta #<span id="verVentaId"></span></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="verVentaContent">
                    <!-- Contenido dinámico -->
                </div>
                <div class="modal-footer border-0">
                    <button type="button" class="btn btn-whatsapp" id="btnCompartirWhatsApp">
                        <i class="bi bi-whatsapp"></i> Compartir Pedido
                    </button>
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cerrar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- CSRF Meta Tags -->
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.7/js/dataTables.bootstrap5.min.js"></script>
    <script src="https://cdn.datatables.net/responsive/2.5.0/js/dataTables.responsive.min.js"></script>
    <script src="https://cdn.datatables.net/responsive/2.5.0/js/responsive.bootstrap5.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

    <script th:src="@{/js/main.js}"></script>
    <script th:src="@{/js/ventas.js}"></script>
</body>

</html>
